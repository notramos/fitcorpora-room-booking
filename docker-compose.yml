# Build and run with: ./build.sh
#
# Data lives in PostgreSQL (the `db` service below); the app creates its
# schema on first connect. The `pgdata` volume persists it across restarts.
services:
  db:
    image: postgres:17-alpine
    container_name: room-booking-db
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: booking
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # Only on the private network — Postgres is never exposed to Traefik or
    # other stacks sharing traefik-public.
    networks:
      - internal

  app:
    build:
      context: .
    image: room-booking-system:latest
    container_name: room-booking-system
    expose:
      - "3000"
    # .env.prod supplies DATABASE_URL — point it at the `db` service with
    # postgres://booking:booking@db:5432/booking, or at a managed Postgres
    # elsewhere (in which case the `db` service above can be removed).
    env_file: ./.env.prod
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - traefik-public
      - internal
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.http.routers.room-booking-system.rule=Host(`room.fitcorpora.com`)
      - traefik.http.routers.room-booking-system.entrypoints=websecure
      - traefik.http.routers.room-booking-system.tls.certresolver=le
      - traefik.http.services.room-booking-system.loadbalancer.server.port=3000

volumes:
  pgdata:

networks:
  traefik-public:
    external: true
  internal:
    driver: bridge
