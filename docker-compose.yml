# Build and run with: ./build.sh
#
# app/display/page.tsx prerenders at build time using live Google Sheets
# data, so `docker compose build` needs the secret files below to exist
# first — build.sh extracts them from .env.prod automatically.
services:
  app:
    build:
      context: .
      secrets:
        - google_sa_email
        - google_private_key
        - google_sheet_id
    image: room-booking-system:latest
    container_name: room-booking-system
    expose:
      - "3000"
    env_file: ./.env.prod
    restart: unless-stopped
    networks:
      - traefik-public
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.http.routers.room-booking-system.rule=Host(`room-booking.fitcorpora.com`)
      - traefik.http.routers.room-booking-system.entrypoints=web
      - traefik.http.services.room-booking-system.loadbalancer.server.port=3000

secrets:
  google_sa_email:
    file: ./.secrets/google_sa_email
  google_private_key:
    file: ./.secrets/google_private_key
  google_sheet_id:
    file: ./.secrets/google_sheet_id

networks:
  traefik-public:
    external: true
